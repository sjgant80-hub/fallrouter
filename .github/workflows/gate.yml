name: gate
# v25 upgrade: the routing decision (classify + local-first-then-frontier chooseLeg) + the audit chain
# are now a real gated kernel (kernel.mjs). The gate proves it — tests, a mutation witness that must be
# CLEAN, and a page fixpoint (the live demo IS the injected kernel). The Node service imports the same
# kernel, so the live routing logic is the gated logic.
on: [push, pull_request, workflow_dispatch]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: tests
        run: node --test kernel.test.mjs
      - name: mutation gate — kernel.mjs must be CLEAN
        run: |
          node tools/witness.mjs mutate kernel.mjs --timeout 30000 --cap 600 --baseline witness.baseline.json --test node --test kernel.test.mjs | tee gate.out || true
          node -e "const b=require('fs').readFileSync('gate.out','utf8');const j=JSON.parse(b.slice(b.indexOf('{'),b.lastIndexOf('}')+1));if(j.clean!==true){console.error('GATE NOT CLEAN');process.exit(1)}console.log('CLEAN '+j.killed+'/'+j.total)"
      - name: page fixpoint — the live demo IS the gated kernel
        run: |
          node make-page.mjs
          git diff --exit-code index.html
